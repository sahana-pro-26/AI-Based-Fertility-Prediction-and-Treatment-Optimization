{%load static %}
<!DOCTYPE html>
<html>

<head>

    <title>FertiCare AI</title>

    <link rel="stylesheet" href="{% static 'style.css' %}">

    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url("{% static 'frontpage-bg.png' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .feature-panel {
            background:rgba(255,255,255,0.08) !important;
            backdrop-filter:blur(10px) !important;
            border:1px solid rgba(255,255,255,0.2) !important;
        }
        .feature-btn {
            background:linear-gradient(135deg,#ff4da6,#b85cf6) !important;
        }
        .feature-btn:hover {
            background:linear-gradient(135deg,#ff4da6,#b85cf6) !important;
        }
        h1 {
            font-size: 3.5rem;
            background: linear-gradient(135deg, #ff4da6, #b85cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: bold;
            text-align: center;
        }
        p {
            text-align: center;
        }
        .feature-panel {
            flex-direction: column;
            align-items: center;
        }
        .feature-panel a {
            text-align: center;
        }
    </style>

</head>
<script>

function showFeatures(){

    let panel = document.getElementById("features");

    if(panel.style.display === "flex" || getComputedStyle(panel).display === "flex"){
        panel.style.display = "none";
    }

    else{
        panel.style.display = "flex";
    }
}

</script>
<body>
     
    <div class="container">

        <h1> AI-Based Fertility Prediction & Treatment Optimization</h1>

        <p>
            PCOS Detection • IVF Prediction • Fertility Score • Treatment Recommendation
        </p>

         
    <div class="center-box">

    <button onclick="showFeatures()" class="main-btn">
        Get Started
    </button>

    <div id="features" class="feature-panel" style="display:none;">

        <a href="/pcos/" class="feature-btn">PCOS Detection</a>

        <a href="/ivf/" class="feature-btn">IVF Prediction</a>

        <a href="/score/" class="feature-btn">Fertility Score</a>

        <a href="/recommend/" class="feature-btn">Recommendations</a>

    </div>

</div>

</body>

</html>
