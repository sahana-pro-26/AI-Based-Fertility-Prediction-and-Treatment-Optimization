<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PCOS Prediction</title>
   {% load static %}
<link rel="stylesheet" href="{% static 'style.css' %}">
<style>


.container{
    background:white;
    width:380px;
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#ff4da6;
    margin-bottom:25px;
}

.pcos-form{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.pcos-form label{
    display:flex;
    flex-direction:column;
    gap:10px;
    text-align:left;
}

.field-label{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-size:16px;
    font-weight:700;
    color:#333;
}

.pcos-form input,
.pcos-form select{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#f3f3f3;
    font-size:16px;
    outline:none;
}

.pcos-form button{
    padding:15px;
    border:none;
    border-radius:50px;
    background:linear-gradient(135deg,#ff4da6,#8b5cf6);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.pcos-form button:hover{
    transform:scale(1.03);
}

.result{
    text-align:center;
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
    color:#8b5cf6;
}

</style>
</head>

<body>

<div class="container">

    <h1>PCOS/PMOS Detection System</h1>

    <form class="pcos-form" id="pcosForm">

        <label>
            <span class="field-label">🔢 Age</span>
            <input name="age" type="number" placeholder="Enter Age" required>
        </label>

        <label>
            <span class="field-label">⚖️ Weight</span>
            <input name="weight" type="number" placeholder="Enter Weight" required>
        </label>

        <label>
            <span class="field-label">🔄 Irregular Period</span>
            <select name="irregular_period" required>
                <option value="" disabled selected>Select an option</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </label>

        <label>
            <span class="field-label">💧 Acne Problem</span>
            <select name="acne_problem" required>
                <option value="" disabled selected>Select an option</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </label>

        <label>
            <span class="field-label">🧑‍🦲 Hair Loss</span>
            <select name="hair_loss" required>
                <option value="" disabled selected>Select an option</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </label>

        <label>
            <span class="field-label">🧔 Excess Facial Hair</span>
            <select name="facial_hair" required>
                <option value="" disabled selected>Select an option</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </label>

        <label>
            <span class="field-label">😕 Mood Swings</span>
            <select name="mood_swings" required>
                <option value="" disabled selected>Select an option</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </label>

        <button type="submit">
            Predict
        </button>

    </form>

    <div class="result" id="result"></div>


</html> 

</div>

<script>

document.getElementById("pcosForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    document.getElementById("result")
    .innerHTML = "Prediction Submitted Successfully!";

});

</script>

</body>
</html>
